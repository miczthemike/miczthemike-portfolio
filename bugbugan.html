<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Rumble Simulation Extreme</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5), 2px 2px 4px #000;
            font-weight: 900;
        }

        #game-container {
            display: flex;
            gap: 20px;
            background: #141419;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border: 1px solid #2a2a35;
        }

        canvas {
            background: #111116;
            border-radius: 6px;
            box-shadow: inset 0 0 20px #000;
            border: 1px solid #222;
        }

        #ui-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-box {
            background: #1a1a24;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #323244;
        }

        h3 {
            margin: 0 0 12px 0;
            color: #ffcc00;
            border-bottom: 2px solid #2a2a3a;
            padding-bottom: 6px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background: #ffcc00;
            border: none;
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #ffee55;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #2a2a35;
            color: #5a5a6a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #ticker-box {
            height: 150px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 5px;
        }

        #ticker-box::-webkit-scrollbar {
            width: 4px;
        }
        #ticker-box::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 2px;
        }

        .ticker-entry {
            padding: 6px;
            border-radius: 4px;
            line-height: 1.4;
            animation: fadeIn 0.25s ease-out forwards;
            border-left: 3px solid transparent;
        }

        .entry-join { background: rgba(0, 255, 100, 0.08); color: #44ff88; border-left-color: #00ff64; }
        .entry-elim { background: rgba(255, 50, 50, 0.08); color: #ff5555; border-left-color: #ff3232; }
        .entry-boom { background: rgba(255, 150, 0, 0.12); color: #ffaa33; font-weight: bold; border-left-color: #ff9600; }
        .entry-win { background: rgba(255, 204, 0, 0.15); color: #ffcc00; font-weight: bold; font-size: 13px; border-left-color: #ffcc00; border-right: 3px solid #ffcc00; text-align: center; }

        #stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #stats-list li {
            border-bottom: 1px solid #222230;
            padding-bottom: 4px;
        }

        #stats-list span {
            float: right;
            font-weight: bold;
            color: #ffcc00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(-3px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>

<style>
#winner-banner{
    display:none;
    position:absolute;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    z-index:20;
    text-align:center;
    pointer-events:none;
    padding:8px 20px 10px;
    border:2px solid #ffd700;
    border-radius:12px;
    background:rgba(0,0,0,.88);
    box-shadow:0 0 28px rgba(255,215,0,.75);
}
#winner-banner .winner-label{
    font-size:14px;
    font-weight:900;
    letter-spacing:4px;
    color:#ffd700;
}
#winner-banner .winner-name{
    font-size:26px;
    font-weight:1000;
    color:#fff;
    text-shadow:0 0 10px #ffd700,0 0 22px #ffd700;
    margin-top:2px;
}
.winner-glow{
    animation:winnerPulse 1s infinite alternate;
}
@keyframes winnerPulse{
    from{filter:drop-shadow(0 0 5px #ffd700)}
    to{filter:drop-shadow(0 0 18px #ffd700)}
}
</style>

</head>
<body>

<div id="winner-banner">
    <div class="winner-label">🏆 ROYAL RUMBLE WINNER 🏆</div>
    <div id="winner-name" class="winner-name"></div>
</div>


    <h1>Royal Rumble Simulator</h1><div id="match-timer" style="font-size:32px;font-weight:900;color:#ffcc00;letter-spacing:3px;margin:2px 0 10px;">02:00</div>
<div style="color:#aaa;font-size:11px;letter-spacing:2px;margin-bottom:8px;">2D WRESTLING SIMULATION</div>
    
    <div id="game-container">
        <canvas id="ringCanvas" width="550" height="550"></canvas>
        
        <div id="ui-panel">
            <div class="panel-box">
<h3>Match Setup</h3>
<label style="display:block;font-size:12px;margin-bottom:6px;">Time Limit (minutes)</label>
<input id="timeLimitInput" type="number" min="1" max="60" value="2" style="width:100%;box-sizing:border-box;padding:9px;background:#111116;color:#fff;border:1px solid #3a3a4a;border-radius:4px;margin-bottom:10px;">
<label style="display:block;font-size:12px;margin-bottom:6px;">Wrestler Names — one name per line</label>
<textarea id="namesInput" rows="8" style="width:100%;box-sizing:border-box;resize:vertical;padding:9px;background:#111116;color:#fff;border:1px solid #3a3a4a;border-radius:4px;font-family:Segoe UI,sans-serif;">The Rock
Stone Cold

Undertaker
Triple H

Hulk Hogan

Brock Lesnar
Goldberg

Drew McIntyre
Sheamus
Bobby Lashley
Gunther
LA Knight</textarea>
<div style="font-size:11px;color:#888;margin-top:5px;">All names are placed in the arena at the same time.</div>
</div><div id="controls">
                <button id="startBtn">Start Rumble</button>
                <button id="pauseBtn" disabled>Pause</button>
            </div>

            <div class="panel-box">
                <h3>Match Tracker</h3>
                <ul id="stats-list">
                    <li>Match Status: <span id="stat-status">Ready</span></li>
                    <li>Entrants Cleared: <span id="stat-count">0 / 30</span></li>
                    <li>Active in Ring: <span id="stat-inside">0</span></li>
                    <li>Total Eliminated: <span id="stat-eliminated">0</span></li>
                </ul>
            </div>

            <div class="panel-box">
                <h3>Rumble Commentary Feed</h3>
                <div id="ticker-box"></div>
            </div>
        </div>
    </div>

    <script>





const CANVAS=document.getElementById('ringCanvas'),CTX=CANVAS.getContext('2d');
const RING_SIZE=320,RING_X=(CANVAS.width-RING_SIZE)/2,RING_Y=(CANVAS.height-RING_SIZE)/2;
let NAMES_POOL=[],TOTAL_ENTRANTS=0,MATCH_TIME_LIMIT=120,timeRemaining=120,matchStartTime=0,matchActive=false,matchOver=false,animationId=null,superstars=[],particles=[],celebrationActive=false,celebrationWinner=null,celebrationStart=0,confetti=[],winnerWalking=false,timeLimitElimination=false;
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),tickerBox=document.getElementById('ticker-box');
const statStatus=document.getElementById('stat-status'),statCount=document.getElementById('stat-count'),statInside=document.getElementById('stat-inside'),statEliminated=document.getElementById('stat-eliminated');
const matchTimer=document.getElementById('match-timer'),namesInput=document.getElementById('namesInput'),timeLimitInput=document.getElementById('timeLimitInput');
const winnerBanner=document.getElementById('winner-banner'),winnerName=document.getElementById('winner-name');
const rnd=(a,b)=>Math.random()*(b-a)+a;
function log(t,type='join'){const e=document.createElement('div');e.className=`ticker-entry entry-${type}`;e.textContent=t;tickerBox.appendChild(e);tickerBox.scrollTop=tickerBox.scrollHeight;}
function timer(){let n=Math.max(0,Math.ceil(timeRemaining)),m=Math.floor(n/60),s=n%60;matchTimer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
class Particle{constructor(x,y,c){this.x=x;this.y=y;this.vx=rnd(-3,3);this.vy=rnd(-3,3);this.r=rnd(2,5);this.c=c;this.a=1;this.d=rnd(.02,.05)}update(){this.x+=this.vx;this.y+=this.vy;this.a-=this.d}draw(){CTX.save();CTX.globalAlpha=Math.max(0,this.a);CTX.beginPath();CTX.arc(this.x,this.y,this.r,0,Math.PI*2);CTX.fillStyle=this.c;CTX.fill();CTX.restore()}}
function boom(x,y,c,n=12){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c))}

class Confetti{
constructor(x,y){this.x=x;this.y=y;this.vx=rnd(-5,5);this.vy=rnd(-9,-3);this.size=rnd(4,9);this.rotation=rnd(0,6.28);this.spin=rnd(-.2,.2);this.life=1;this.color=['#ffcc00','#ff3b30','#00f0ff','#af52de','#44ff88','#fff'][Math.floor(Math.random()*6)]}
update(){this.vy+=.18;this.x+=this.vx;this.y+=this.vy;this.rotation+=this.spin;this.life-=.006}
draw(){CTX.save();CTX.globalAlpha=Math.max(0,this.life);CTX.translate(this.x,this.y);CTX.rotate(this.rotation);CTX.fillStyle=this.color;CTX.fillRect(-this.size/2,-this.size/2,this.size,this.size*1.7);CTX.restore()}
}
function launchConfetti(){for(let i=0;i<220;i++)confetti.push(new Confetti(CANVAS.width/2+rnd(-40,40),CANVAS.height*.42+rnd(-10,20)))}
function updateConfetti(){for(let i=confetti.length-1;i>=0;i--){confetti[i].update();confetti[i].draw();if(confetti[i].life<=0||confetti[i].y>CANVAS.height+30)confetti.splice(i,1)}}

class Superstar{
constructor(id,name){this.id=id;this.name=name;this.x=RING_X+25+Math.random()*(RING_SIZE-50);this.y=RING_Y+25+Math.random()*(RING_SIZE-50);this.isEliminated=false;this.targetId=null;this.stamina=100;this.vx=0;this.vy=0;let t=['Striker','Giant','High-Flyer','Technician'];this.type=t[Math.floor(Math.random()*4)];if(this.type==='Giant'){this.radius=15;this.speed=rnd(.8,1.2);this.weight=85;this.color='#ff3b30'}else if(this.type==='High-Flyer'){this.radius=10;this.speed=rnd(2.2,3);this.weight=35;this.color='#00f0ff'}else if(this.type==='Striker'){this.radius=12;this.speed=rnd(1.6,2.2);this.weight=55;this.color='#ffcc00'}else{this.radius=11;this.speed=rnd(1.8,2.4);this.weight=50;this.color='#af52de'}}
update(roster){if(this.isEliminated){this.y+=5;return}let t=roster.find(s=>s.id===this.targetId&&!s.isEliminated);if(!t||Math.random()<.02){let e=roster.filter(s=>s.id!==this.id&&!s.isEliminated);if(e.length){t=e[Math.floor(Math.random()*e.length)];this.targetId=t.id}}if(t){let dx=t.x-this.x,dy=t.y-this.y,d=Math.max(.1,Math.hypot(dx,dy));if(d>this.radius+t.radius+7){this.vx=dx/d*this.speed;this.vy=dy/d*this.speed}else{this.vx=rnd(-1.5,1.5);this.vy=rnd(-1.5,1.5);let f=(this.type==='Striker'?12:8)/(t.weight/45);t.x+=dx/d*f;t.y+=dy/d*f;this.stamina=Math.max(0,this.stamina-.15);if(Math.random()<.008&&this.stamina>15){let p=f*6;t.x+=dx/d*p;t.y+=dy/d*p;t.stamina=Math.max(0,t.stamina-20);log(`💥 ${this.name} hits a Finisher on ${t.name}!`,'boom');boom(t.x,t.y,'#fff',15)}}}this.x+=this.vx;this.y+=this.vy;this.ropes()}
ropes(){let l=RING_X,r=RING_X+RING_SIZE,t=RING_Y,b=RING_Y+RING_SIZE;if(this.x<l||this.x>r||this.y<t||this.y>b){let chance=.04+(100-this.stamina)/250+(100-this.weight)/300;if(Math.random()<chance){this.isEliminated=true;let k=superstars.find(s=>!s.isEliminated&&s.targetId===this.id);log(`❌ ${this.name} has been ${k?`thrown out by ${k.name}!`:'flung over the top rope!'}`,'elim');boom(this.x,this.y,'#f33',25)}else{if(this.x<l){this.x=l+8;this.vx*=-1.2}if(this.x>r){this.x=r-8;this.vx*=-1.2}if(this.y<t){this.y=t+8;this.vy*=-1.2}if(this.y>b){this.y=b-8;this.vy*=-1.2}this.stamina=Math.max(5,this.stamina-8)}}}
draw(){if(this.y>CANVAS.height+50)return;CTX.save();let s=this.radius/12;CTX.beginPath();CTX.ellipse(this.x,this.y+18*s,11*s,4*s,0,0,Math.PI*2);CTX.fillStyle='rgba(0,0,0,.45)';CTX.fill();CTX.lineWidth=Math.max(2,3*s);CTX.lineCap='round';CTX.strokeStyle='#ddd';CTX.beginPath();CTX.moveTo(this.x-3*s,this.y+7*s);CTX.lineTo(this.x-5*s,this.y+15*s);CTX.moveTo(this.x+3*s,this.y+7*s);CTX.lineTo(this.x+5*s,this.y+15*s);CTX.stroke();CTX.fillStyle='#111';CTX.fillRect(this.x-8*s,this.y+13*s,6*s,3*s);CTX.fillRect(this.x+2*s,this.y+13*s,6*s,3*s);CTX.strokeStyle=this.color;CTX.lineWidth=Math.max(2,3.5*s);CTX.beginPath();CTX.moveTo(this.x-6*s,this.y-2*s);CTX.lineTo(this.x-11*s,this.y+6*s);CTX.moveTo(this.x+6*s,this.y-2*s);CTX.lineTo(this.x+11*s,this.y+6*s);CTX.stroke();CTX.fillStyle=this.color;CTX.beginPath();CTX.roundRect(this.x-6*s,this.y-4*s,12*s,16*s,3*s);CTX.fill();CTX.beginPath();CTX.arc(this.x,this.y-11*s,6*s,0,Math.PI*2);CTX.fillStyle='#f1c7a5';CTX.fill();CTX.beginPath();CTX.arc(this.x,this.y-12*s,6*s,Math.PI,Math.PI*2);CTX.fillStyle='#202020';CTX.fill();let w=Math.max(24,32*s),x=this.x-w/2,y=this.y-25*s;CTX.fillStyle='#111';CTX.fillRect(x,y,w,4);CTX.fillStyle='#44ff88';CTX.fillRect(x,y,w*this.stamina/100,4);CTX.fillStyle='#fff';CTX.font='bold 10px Segoe UI';CTX.shadowColor='#000';CTX.shadowBlur=4;CTX.textAlign='center';CTX.fillText(this.name.length>16?this.name.slice(0,15)+'…':this.name,this.x,this.y-29*s);CTX.restore()}}
function arena(){CTX.clearRect(0,0,CANVAS.width,CANVAS.height);CTX.fillStyle='#181822';CTX.fillRect(0,0,CANVAS.width,CANVAS.height);CTX.fillStyle='#282835';CTX.fillRect(RING_X,RING_Y,RING_SIZE,RING_SIZE);CTX.strokeStyle='#111';CTX.lineWidth=8;CTX.strokeRect(RING_X,RING_Y,RING_SIZE,RING_SIZE);CTX.lineWidth=3;CTX.strokeStyle='#e60000';CTX.strokeRect(RING_X-2,RING_Y-2,RING_SIZE+4,RING_SIZE+4);CTX.strokeStyle='#fff';CTX.strokeRect(RING_X-5,RING_Y-5,RING_SIZE+10,RING_SIZE+10);CTX.save();CTX.fillStyle='rgba(255,255,255,.035)';CTX.font='900 58px Impact';CTX.textAlign='center';CTX.textBaseline='middle';CTX.fillText('ROYAL RUMBLE',CANVAS.width/2,CANVAS.height/2);CTX.restore()}
function stats(roster){statCount.textContent=`${superstars.length} / ${TOTAL_ENTRANTS}`;statInside.textContent=roster.length;statEliminated.textContent=superstars.filter(s=>s.isEliminated).length}

function startTimeLimitElimination(champ, roster){
    if(timeLimitElimination || celebrationActive)return;

    timeLimitElimination=true;
    matchOver=true;
    statStatus.textContent='⏰ TIME LIMIT — ELIMINATING LOSERS';

    // Winner stays in the arena. Every other wrestler is sent
    // toward the outside of the ring before the winner celebration.
    roster.forEach(w=>{
        if(w.id!==champ.id){
            w.isEliminated=true;
            w.eliminationX=w.x;
            w.eliminationY=w.y;
            w.eliminationTargetX = w.x < RING_X + RING_SIZE/2
                ? RING_X - 65
                : RING_X + RING_SIZE + 65;
            w.eliminationTargetY = w.y;
        }
    });

    champ.isEliminated=false;
    champ.targetX=RING_X+(RING_SIZE/2);
    champ.targetY=RING_Y+(RING_SIZE/2);

    // Keep a short animation window so the losing wrestlers
    // visibly leave the ring.
    setTimeout(()=>{
        timeLimitElimination=false;
        finish(champ,'time');
    },1400);
}

function finish(champ,reason){
    matchOver=true;
    matchActive=true;
    celebrationActive=true;
    celebrationWinner=champ;
    celebrationStart=performance.now();
    winnerWalking=true;

    // Remove every other wrestler from the arena immediately.
    superstars.forEach(w=>{
        if(w.id!==champ.id){
            w.isEliminated=true;
            w.x=-100;
            w.y=-100;
            w.vx=0;
            w.vy=0;
        }
    });

    // Force the winner to walk to the actual ring center.
    champ.isEliminated=false;
    champ.targetX=RING_X+(RING_SIZE/2);
    champ.targetY=RING_Y+(RING_SIZE/2);
    champ.vx=0;
    champ.vy=0;

    winnerName.textContent=champ.name;
    winnerBanner.style.display='block';
    winnerBanner.classList.add('winner-glow');

    if(reason==='time'){
        log('⏰ TIME LIMIT REACHED!','boom');
        log(`🏆 ${champ.name} WINS BY SURVIVAL!`,'win');
    }else{
        log(`🏆 ${champ.name} IS THE LAST ONE STANDING!`,'win');
    }

    boom(champ.x,champ.y,'#ffcc00',60);
    launchConfetti();
    timeRemaining=0;
    timer();
    stats([champ]);
    statStatus.textContent='🏆 WINNER CELEBRATION';
    pauseBtn.disabled=true;
    startBtn.disabled=false;
    startBtn.textContent='Simulate Again';
}

function setup(){let names=[...new Set(namesInput.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];if(names.length<2){alert('Please enter at least 2 names, one per line.');return false}let mins=Math.max(1,Math.min(60,Number(timeLimitInput.value)||2));NAMES_POOL=names;TOTAL_ENTRANTS=names.length;MATCH_TIME_LIMIT=mins*60;timeRemaining=MATCH_TIME_LIMIT;matchStartTime=performance.now();superstars=names.map((n,i)=>new Superstar(i+1,n));particles=[];confetti=[];celebrationActive=false;celebrationWinner=null;winnerWalking=false;timeLimitElimination=false;matchOver=false;matchActive=true;winnerBanner.style.display='none';winnerBanner.classList.remove('winner-glow');winnerName.textContent='';winnerBanner.style.display='none';winnerBanner.classList.remove('winner-glow');winnerName.textContent='';tickerBox.innerHTML='';statStatus.textContent='Live Action';startBtn.disabled=true;pauseBtn.disabled=false;startBtn.textContent='Start Rumble';log(`🚀 ALL ${TOTAL_ENTRANTS} WRESTLERS ARE IN THE ARENA!`,'win');log(`⏱️ TIME LIMIT: ${mins} MINUTE${mins===1?'':'S'}`,'boom');stats(superstars);timer();return true}
function loop(ts){
    if(!matchActive)return;

    arena();

    // TIME-LIMIT LOSERS LEAVE THE RING FIRST.
    if(timeLimitElimination){
        for(let i=particles.length-1;i>=0;i--){
            particles[i].update();
            particles[i].draw();
            if(particles[i].a<=0)particles.splice(i,1);
        }

        const champ=superstars.find(w=>!w.isEliminated);
        superstars.forEach(w=>{
            if(w.id===champ.id){
                w.draw();
                return;
            }

            // Move each losing wrestler outward from the ring.
            const dx=w.eliminationTargetX-w.x;
            const dy=w.eliminationTargetY-w.y;
            const d=Math.hypot(dx,dy);

            if(d>3){
                w.x+=(dx/d)*3.5;
                w.y+=(dy/d)*3.5;
                w.draw();
            }else{
                // Draw the loser outside the ring briefly, then it disappears.
                w.draw();
            }
        });

        stats([champ]);
        animationId=requestAnimationFrame(loop);
        return;
    }

    // WINNER WALKING / CELEBRATION MODE
    if(celebrationActive && celebrationWinner){
        const w=celebrationWinner;

        // Move the winner toward the exact center of the ring.
        const dx=w.targetX-w.x;
        const dy=w.targetY-w.y;
        const distance=Math.hypot(dx,dy);

        if(distance>2){
            winnerWalking=true;

            // Constant visible walking speed.
            const speed=Math.min(2.0,Math.max(0.7,distance/12));
            w.vx=(dx/distance)*speed;
            w.vy=(dy/distance)*speed;
            w.x+=w.vx;
            w.y+=w.vy;
        }else{
            w.x=w.targetX;
            w.y=w.targetY;
            w.vx=0;
            w.vy=0;
            winnerWalking=false;
        }

        // Draw celebration effects.
        for(let i=particles.length-1;i>=0;i--){
            particles[i].update();
            particles[i].draw();
            if(particles[i].a<=0)particles.splice(i,1);
        }

        updateConfetti();

        // Only the winner is drawn.
        w.draw();

        // Winner label appears above the character after reaching center.
        if(!winnerWalking){
            CTX.save();
            CTX.textAlign='center';
            CTX.font='900 15px Segoe UI,sans-serif';
            CTX.fillStyle='#ffd700';
            CTX.shadowColor='#000';
            CTX.shadowBlur=7;
            CTX.fillText('🏆 WINNER 🏆',w.x,w.y-42);
            CTX.restore();
        }

        if(ts-celebrationStart<1800 && Math.random()<0.10){
            launchConfetti();
        }

        animationId=requestAnimationFrame(loop);
        return;
    }

    timeRemaining=Math.max(
        0,
        MATCH_TIME_LIMIT-((ts-matchStartTime)/1000)
    );
    timer();

    const roster=superstars.filter(s=>!s.isEliminated);

    for(let i=particles.length-1;i>=0;i--){
        particles[i].update();
        particles[i].draw();
        if(particles[i].a<=0)particles.splice(i,1);
    }

    superstars.forEach(s=>s.update(roster));
    superstars.forEach(s=>s.draw());
    stats(roster);

    if(roster.length===1){
        finish(roster[0],'last');
        return;
    }

    if(timeRemaining<=0){
        const sorted=roster.slice().sort(
            (x,y)=>(y.stamina-x.stamina)||(y.weight-x.weight)
        );
        startTimeLimitElimination(sorted[0], roster);
        return;
    }

    animationId=requestAnimationFrame(loop);
}

startBtn.addEventListener('click',()=>{if(animationId)cancelAnimationFrame(animationId);if(setup())animationId=requestAnimationFrame(loop)});
pauseBtn.addEventListener('click',()=>{if(!matchActive)return;matchActive=false;statStatus.textContent='Paused';startBtn.disabled=false;pauseBtn.disabled=true;startBtn.textContent='Resume';if(animationId)cancelAnimationFrame(animationId)});
arena();timer();

    
    
    
    
    </script>
</body>
</html>
