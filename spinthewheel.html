<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel - MicztheMike</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #ffd700;
            --bg-color: #000033;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --modal-bg: #1a1a2e;
            --card-bg: #16213e;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #particle-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        .header {
            margin-top: 20px;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 450px;
            max-height: 450px;
            margin: 20px 0;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        #pointer {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.05s ease-out;
            transform-origin: 50% 10%;
        }

        #pointer.tick {
            transform: translateX(-50%) rotate(-15deg);
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 5;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        .center-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spin-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--primary-color);
            color: black;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
            margin-bottom: 20px;
        }

        .spin-btn:hover {
            transform: translateY(-2fpx);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }

        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .menu-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s, transform 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .modal h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .winner-modal {
            background: rgba(0, 0, 0, 0.85) !important;
            text-align: center;
        }

        .winner-card {
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,1);
        }

        textarea, select, input[type="text"], input[type="number"] {
            width: 100%;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
            font-size: 0.95rem;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 2px; font-size: 0.9rem; color: #cbd5e1; }

        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.5rem;
            color: #aaa;
            transition: color 0.2s;
        }

        .close-btn:hover { color: white; }

        .preset-row {
            margin-bottom: 15px;
        }

        .attribution {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="particle-bg"></canvas>

    <div class="header">
        <h1 class="title" id="mainTitle">SPIN & WIN</h1>
    </div>

    <div class="container">
        <div class="wheel-container">
            <svg id="pointer" viewBox="0 0 100 100">
                <path d="M50 100 L10 20 L90 20 Z" fill="gold" stroke="white" stroke-width="2"/>
            </svg>
            <canvas id="wheelCanvas" width="800" height="800"></canvas>
            <div class="center-logo">
                <img id="logoImg" src="https://via.placeholder.com/150" alt="Logo">
            </div>
        </div>

        <button class="spin-btn" id="spinBtn">SPIN NOW</button>

        <div class="menu-row">
            <button class="icon-btn" onclick="openModal('namesModal')" title="Customise Wheel">📝</button>
            <button class="icon-btn" onclick="openModal('settingsModal')" title="Settings">⚙️</button>
            <button class="icon-btn" id="soundToggleBtn" onclick="toggleSound()" title="Sound On/Off">🔊</button>
        </div>
    </div>

    <div class="attribution">Created by MicztheMike</div>

    <!-- Names Modal -->
    <div id="namesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('namesModal')">&times;</span>
            <h2>Customise Wheel</h2>

            <div class="preset-row">
                <label for="presetSelect">Quick Load Presets</label>
                <select id="presetSelect" onchange="loadPreset(this.value)">
                    <option value="">-- Choose Preset --</option>
                    <option value="prizes">Standard Prizes</option>
                    <option value="yesno">Yes / No / Maybe</option>
                    <option value="dice">Dice (1 - 6)</option>
                    <option value="dinner">Dinner Options</option>
                    <option value="truthordare">Truth or Dare</option>
                </select>
            </div>

            <label for="namesInput">Edit entries (one per line):</label>
            <textarea id="namesInput">Prize 1
Prize 2
Prize 3
Prize 4
Prize 5
Prize 6</textarea>

            <button class="spin-btn" style="width:100%; margin-top:15px;" onclick="updateNames()">Update Wheel</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('settingsModal')">&times;</span>
            <h2>Settings</h2>
            <div class="form-group">
                <label for="titleEdit">Main Title</label>
                <input type="text" id="titleEdit" value="SPIN & WIN">
            </div>
            <div class="form-group">
                <label for="btnEdit">Spin Button Text</label>
                <input type="text" id="btnEdit" value="SPIN NOW">
            </div>
            <div class="form-group">
                <label for="durationEdit">Duration (seconds)</label>
                <input type="number" id="durationEdit" value="5" min="1" max="20" step="0.5">
            </div>
            <div class="form-group">
                <label for="logoUpload">Custom Center Logo</label>
                <input type="file" id="logoUpload" accept="image/*" onchange="handleLogo(event)">
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="raffleMode">
                    <span>Raffle Mode (Allow removing winner)</span>
                </label>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="soundFxToggle" checked>
                    <span>Enable Sound Effects</span>
                </label>
            </div>
            <button class="spin-btn" style="width:100%;" onclick="saveSettings()">Save Changes</button>
            <button style="width:100%; margin-top:10px; background:transparent; border:1px solid #ff4444; color:#ff4444; padding:8px; border-radius:25px; cursor:pointer;" onclick="resetDefaults()">Reset to Defaults</button>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="modal winner-modal">
        <div class="winner-card">
            <div id="winnerLogoContainer"></div>
            <h1 id="winnerHeaderDisplay">🎉 YOU WON!</h1>
            <h2 id="winnerName" style="font-size: 3rem; color: var(--primary-color); word-break: break-word; margin: 20px 0;"></h2>
            <button class="spin-btn" onclick="closeModal('winnerModal')">Awesome!</button>
            <br>
            <button id="removeBtn" style="background:transparent; color:#ff5555; border:1px solid #ff5555; padding:8px 20px; border-radius:20px; margin-top:15px; cursor:pointer; display:none;" onclick="removeWinner()">Remove from Wheel</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const pointerEl = document.getElementById('pointer');

        let names = ["Prize 1", "Prize 2", "Prize 3", "Prize 4", "Prize 5", "Prize 6"];
        let currentRotation = 0;
        let isSpinning = false;
        let lastWinner = "";
        let audioCtx = null;
        let soundEnabled = true;

        // Settings config
        let config = {
            duration: 5,
            title: "SPIN & WIN",
            btnText: "SPIN NOW",
            raffle: false,
            sound: true,
            logoData: ""
        };

        const presets = {
            prizes: ["Prize 1", "Prize 2", "Prize 3", "Prize 4", "Prize 5", "Prize 6"],
            yesno: ["Yes ✅", "No ❌", "Maybe 🤔", "Ask Again 🔄"],
            dice: ["1 🎲", "2 🎲", "3 🎲", "4 🎲", "5 🎲", "6 🎲"],
            dinner: ["Pizza 🍕", "Burgers 🍔", "Sushi 🍣", "Tacos 🌮", "Pasta 🍝", "Salad 🥗", "Chinese 🥡", "Thai 🍜"],
            truthordare: ["Truth 🤫", "Dare 😈", "Truth 🤫", "Dare 😈", "Truth 🤫", "Dare 😈"]
        };

        // --- Persistence Functions ---
        function saveState() {
            try {
                localStorage.setItem('stw_names', JSON.stringify(names));
                localStorage.setItem('stw_config', JSON.stringify(config));
            } catch (e) {
                console.warn('LocalStorage save failed:', e);
            }
        }

        function loadSavedState() {
            try {
                const savedNames = localStorage.getItem('stw_names');
                if (savedNames) names = JSON.parse(savedNames);

                const savedConfig = localStorage.getItem('stw_config');
                if (savedConfig) {
                    config = { ...config, ...JSON.parse(savedConfig) };
                }
            } catch (e) {
                console.warn('LocalStorage load failed:', e);
            }

            // Sync UI elements with loaded state
            document.getElementById('namesInput').value = names.join('\n');
            document.getElementById('mainTitle').innerText = config.title;
            document.getElementById('titleEdit').value = config.title;
            document.getElementById('spinBtn').innerText = config.btnText;
            document.getElementById('btnEdit').value = config.btnText;
            document.getElementById('durationEdit').value = config.duration;
            document.getElementById('raffleMode').checked = config.raffle;
            document.getElementById('soundFxToggle').checked = config.sound;
            soundEnabled = config.sound;
            updateSoundIcon();

            if (config.logoData) {
                document.getElementById('logoImg').src = config.logoData;
            }
        }

        // --- Web Audio API FX ---
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {}
        }

        function playWinSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = audioCtx.currentTime + (idx * 0.1);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            config.sound = soundEnabled;
            document.getElementById('soundFxToggle').checked = soundEnabled;
            updateSoundIcon();
            saveState();
        }

        function updateSoundIcon() {
            document.getElementById('soundToggleBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // --- Wheel Drawing ---
        function drawWheel() {
            const numSegments = Math.max(1, names.length);
            const segmentAngle = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(currentRotation);

            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * segmentAngle, (i + 1) * segmentAngle);
                ctx.fillStyle = `hsl(${(i * 360) / numSegments}, 75%, 52%)`;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.rotate(i * segmentAngle + segmentAngle / 2);
                ctx.fillStyle = 'white';
                const fontSize = Math.max(12, Math.min(32, 280 / numSegments));
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = 'right';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // Truncate text if too long
                let text = names[i] || "";
                if (text.length > 20) text = text.substring(0, 18) + "..";
                ctx.fillText(text, radius - 40, fontSize / 3);
                ctx.restore();
            }

            ctx.restore();

            // Outer border
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 6, 0, Math.PI * 2);
            ctx.strokeStyle = 'gold';
            ctx.lineWidth = 12;
            ctx.stroke();
        }

        // --- Spin Handler ---
        spinBtn.addEventListener('click', () => {
            if (isSpinning || names.length === 0) return;
            initAudio();
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "SPINNING...";

            const numSegments = names.length;
            const segmentAngle = (2 * Math.PI) / numSegments;
            const extraSpins = 5 + Math.random() * 5;
            const targetRotation = currentRotation + (extraSpins * Math.PI * 2) + (Math.random() * Math.PI * 2);
            const start = performance.now();
            const duration = config.duration * 1000;

            let lastSegmentIndex = Math.floor(currentRotation / segmentAngle);

            function animate(time) {
                const elapsed = time - start;
                const t = Math.min(elapsed / duration, 1);
                // Cubic easing out
                const easeOut = 1 - Math.pow(1 - t, 3);

                currentRotation = targetRotation * easeOut;

                // Detect segment crossings for tick sound & pointer bounce
                const currentSegmentIndex = Math.floor(currentRotation / segmentAngle);
                if (currentSegmentIndex !== lastSegmentIndex) {
                    lastSegmentIndex = currentSegmentIndex;
                    playTickSound();
                    pointerEl.classList.add('tick');
                    setTimeout(() => pointerEl.classList.remove('tick'), 40);
                }

                drawWheel();

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.innerText = config.btnText;
                    calculateWinner();
                }
            }
            requestAnimationFrame(animate);
        });

        function calculateWinner() {
            if (names.length === 0) return;
            const numSegments = names.length;
            const segmentAngle = (2 * Math.PI) / numSegments;
            const normalizedRotation = (currentRotation % (Math.PI * 2));
            const pointerAngle = (3 * Math.PI / 2);
            let winningIndex = Math.floor((pointerAngle - normalizedRotation + Math.PI * 4) % (Math.PI * 2) / segmentAngle);

            lastWinner = names[winningIndex];
            document.getElementById('winnerName').innerText = lastWinner;

            playWinSound();
            confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
            openModal('winnerModal');

            if (config.raffle) {
                document.getElementById('removeBtn').style.display = 'inline-block';
            } else {
                document.getElementById('removeBtn').style.display = 'none';
            }
        }

        function removeWinner() {
            names = names.filter(n => n !== lastWinner);
            document.getElementById('namesInput').value = names.join('\n');
            saveState();
            drawWheel();
            closeModal('winnerModal');
        }

        function updateNames() {
            const input = document.getElementById('namesInput').value;
            names = input.split('\n').map(s => s.trim()).filter(s => s !== "");
            saveState();
            drawWheel();
            closeModal('namesModal');
        }

        function loadPreset(key) {
            if (!key || !presets[key]) return;
            names = [...presets[key]];
            document.getElementById('namesInput').value = names.join('\n');
            saveState();
            drawWheel();
        }

        function handleLogo(e) {
            if (!e.target.files || !e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                config.logoData = event.target.result;
                document.getElementById('logoImg').src = config.logoData;
                saveState();
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function saveSettings() {
            config.title = document.getElementById('titleEdit').value.trim() || "SPIN & WIN";
            config.btnText = document.getElementById('btnEdit').value.trim() || "SPIN NOW";
            config.duration = Math.max(1, parseFloat(document.getElementById('durationEdit').value) || 5);
            config.raffle = document.getElementById('raffleMode').checked;
            config.sound = document.getElementById('soundFxToggle').checked;
            soundEnabled = config.sound;

            document.getElementById('mainTitle').innerText = config.title;
            document.getElementById('spinBtn').innerText = config.btnText;
            updateSoundIcon();

            saveState();
            closeModal('settingsModal');
        }

        function resetDefaults() {
            if (confirm("Reset all settings and list entries to default?")) {
                localStorage.removeItem('stw_names');
                localStorage.removeItem('stw_config');
                location.reload();
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- Particle Background ---
        const pCanvas = document.getElementById('particle-bg');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];

        function resize() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * pCanvas.width;
                this.y = Math.random() * pCanvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > pCanvas.width) this.x = 0;
                if (this.x < 0) this.x = pCanvas.width;
                if (this.y > pCanvas.height) this.y = 0;
                if (this.y < 0) this.y = pCanvas.height;
            }
            draw() {
                pCtx.fillStyle = 'rgba(255,255,255,0.4)';
                pCtx.beginPath();
                pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                pCtx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animateParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        // --- Init ---
        loadSavedState();
        animateParticles();
        drawWheel();
    </script>
</body>
</html>
