<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HerzGang Race - Stable Web</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #4FC3F7; --secondary: #0288D1; --accent: #FFC107; --success: #4CAF50; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background: #000; }
    
    #game-container { position: relative; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; background: #333; overflow: hidden; border-left: 1px solid #444; border-right: 1px solid #444; transition: max-width 0.3s ease; }
    .landscape-layout { max-width: 100% !important; border: none !important; }
    
    #track-bg { position: absolute; top: 0; left: 0; width: 5000%; height: 100%; background-image: url('photo_2026-05-30_19-18-49.gif'); background-repeat: repeat-x; background-size: auto 100%; z-index: 1; transform: translate3d(0,0,0); }
    
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; background: linear-gradient(to bottom, var(--primary), var(--secondary)); }
    .screen.active { display: flex; }
    h1 { font-size: 2.5rem; color: white; text-shadow: 3px 3px 0px rgba(0,0,0,0.2); margin: 0 0 1.5rem 0; }
    .btn { background: var(--success); color: white; border: none; padding: 12px 30px; font-size: 1.2rem; font-weight: 900; border-radius: 12px; cursor: pointer; margin: 8px; box-shadow: 0 6px 0px #2E7D32; width: 220px; outline: none; transition: transform 0.1s, box-shadow 0.1s; }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0px #2E7D32 !important; }
    
    #names-input { width: 85%; height: 35%; background: rgba(255,255,255,0.95); border-radius: 12px; padding: 10px; margin-bottom: 10px; font-family: inherit; font-weight: bold; border: 2px solid #ddd; resize: none; white-space: pre; overflow-wrap: normal; overflow-x: auto; font-size: 1rem; }
    #character-pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 15px; width: 85%; max-height: 120px; overflow-y: auto; background: rgba(255,255,255,0.95); padding: 10px; border-radius: 12px; border: 2px solid #ddd; }
    .char-label { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: bold; color: #333; cursor: pointer; background: #eee; padding: 5px 8px; border-radius: 8px; }
    .char-label img { width: 35px; height: 35px; object-fit: contain; border-radius: 4px; background: #ddd; }
    
    #race-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; pointer-events: none; }
    
    .racer { position: absolute; width: 110px; height: 110px; transform-origin: bottom center; display: flex; flex-direction: column; align-items: center; transition: transform 0.1s; }
    .racer-img { width: 100%; height: 100%; display: block; object-fit: contain; transition: filter 0.2s; }
    .name-tag { background: rgba(0,0,0,0.75); color: white; padding: 2px 6px; border-radius: 5px; font-size: 10px; white-space: nowrap; font-weight: 900; margin-bottom: 3px; transition: transform 0.2s; }
    
    #leaderboard { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; color: white; font-size: 0.85rem; line-height: 1.5; min-width: 140px; border: 1px solid rgba(255,255,255,0.2); z-index: 90; display: none; }
    #race-timer { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 10px; color: #4FC3F7; font-size: 1.5rem; font-family: monospace; font-weight: 900; z-index: 90; display: none; border: 2px solid #4FC3F7; box-shadow: 0 0 10px rgba(79, 195, 247, 0.5); }
    #countdown { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 10rem; color: white; font-weight: 900; text-shadow: 6px 6px 0 rgba(0,0,0,0.3); z-index: 95; pointer-events: none; }

    #finish-line { position: absolute; top: 0; width: 40px; height: 100%; background: repeating-linear-gradient(45deg, #000, #000 10px, #fff 10px, #fff 20px); z-index: 5; border-left: 2px solid #fff; display: none; }

    @keyframes dropIn { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    .finish-drop { display: block !important; animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes speedBoost { 0% { transform: scale(1) translateX(0); filter: brightness(1); } 50% { transform: scale(1.15) translateX(5px); filter: brightness(1.5) drop-shadow(0 0 10px cyan); } 100% { transform: scale(1) translateX(0); filter: brightness(1); } }
    .boosted-racer .racer-img { animation: speedBoost 0.2s infinite; }
    .boosted-racer .name-tag { color: cyan; transform: scale(1.2); }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulseGold { 0%, 100% { text-shadow: 0 0 10px gold; transform: scale(1); } 50% { text-shadow: 0 0 25px gold; transform: scale(1.05); } }
    
#victory-screen h1 {
    animation: pulseGold 2s infinite;
}

@keyframes zoomLogo {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.3);
    }
}

#victory-logo {
    animation: zoomLogo 2s infinite ease-in-out;
    transform-origin: center;
}

    #winner-name { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; }

    #loading-screen { flex-direction: column; }
    #loading-racer { width: 100px; height: 100px; margin-bottom: 20px; }
    #loading-racer img { width: 100%; height: 100%; animation: bounce 0.5s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  </style>
</head>
<body>
<div id="game-container">
  <div id="track-bg"></div>
  <div id="finish-line"></div>
  <div id="race-layer"></div>
  <div id="leaderboard"></div>
  <div id="race-timer">00.00</div>
  <div id="countdown"></div>
  
  <div id="loading-screen" class="screen">
    <div id="loading-racer"><img src="hg.gif" alt="Running"></div>
    <h1>LOADING...</h1>
    <div style="color:white; font-weight:bold;">Preparing Racoons</div>
  </div>
  
  <div id="menu-screen" class="screen active">
    <h1>HerzGang Race</h1>
    
    <div style="color:white; margin-bottom:5px; font-weight:bold;">Game Mode:</div>
    <select id="mode-select" style="width:200px; padding:8px; border-radius:8px; margin-bottom:15px; font-family:inherit; font-weight:bold; border:none; cursor:pointer;">
      <option value="laps">🏁 Normal Lap Race</option>
      <option value="time">⏱️ Time Attack</option>
    </select>

    <div style="color:white; margin-bottom:5px; font-weight:bold;">Orientation:</div>
    <select id="orient-select" style="width:200px; padding:8px; border-radius:8px; margin-bottom:15px; font-family:inherit; font-weight:bold; border:none; cursor:pointer;">
      <option value="portrait">📱 Portrait</option>
      <option value="landscape">📱➡️ Landscape</option>
    </select>

    <div style="color:white; margin-bottom:5px; font-weight:bold;">Players: <b id="p-count">8</b></div>
    <input type="range" id="p-slider" min="2" max="100" value="8" style="width:200px; margin-bottom:15px;">
    
    <div id="time-settings" style="display:none;">
      <div style="color:white; margin-bottom:5px; font-weight:bold;">Race Timer: <b id="t-count">30</b>s</div>
      <input type="range" id="t-slider" min="10" max="300" step="5" value="30" style="width:200px; margin-bottom:20px;">
    </div>

    <div id="lap-settings">
      <div style="color:white; margin-bottom:5px; font-weight:bold;">Laps: <b id="l-count">1</b></div>
      <input type="range" id="l-slider" min="1" max="20" step="1" value="1" style="width:200px; margin-bottom:20px;">
    </div>

    <button class="btn" id="btn-start">START RACE</button>
    <button class="btn" style="background:#FFC107; box-shadow:0 6px 0 #C79100;" id="btn-customize">CUSTOMIZE</button>
  </div>

  <div id="customize-screen" class="screen">
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Customize</h1>
    <p style="color:white; font-weight:bold; margin-bottom: 5px; margin-top: 0;">Paste Names (one per line)</p>
    <textarea id="names-input" placeholder="Player 1&#10;Player 2&#10;Player 3..."></textarea>
    <p style="color:white; font-weight:bold; margin-bottom: 5px; margin-top: 5px;">Usable Characters</p>
    <div id="character-pool"></div>
    <div style="display:flex; gap:10px; width:85%; justify-content:center;">
        <button class="btn" style="background:#03A9F4; box-shadow:0 6px 0 #0277BD; flex:1; padding:12px 10px;" id="btn-randomize">RANDOM NAMES</button>
        <button class="btn" id="btn-back-menu" style="flex:1; padding:12px 10px;">SAVE & BACK</button>
    </div>
  </div>

  <div id="victory-screen" class="screen" style="background: rgba(0,0,0,0.92);">
	<img src="chicoherz.png" id="victory-logo" style="width: 150px; height: auto; margin-bottom: 10px;">
    <h1 style="color: gold; font-size: 3.5rem;">PALDO!</h1>
    <h2 id="winner-name" style="color: gold; font-size: 2.2rem; margin-bottom:30px; margin-top:0;">🥇 1st</h2>
    <button class="btn" id="btn-play-again">PLAY AGAIN</button>
    <button class="btn" style="background:#03A9F4; box-shadow:0 6px 0 #0277BD;" id="btn-main-menu">MAIN MENU</button>
  </div>
</div>

<script>
  var game = {
    mode: 'laps', 
    orientation: 'portrait',
    laps: 1,
    lapDistance: 2500, 
    finishX: 0,
    finishRank: 1,
    playerNames: [],
    playerCount: 8,
    raceDuration: 30, 
    timeRemaining: 0,
    lastTime: 0,
    racers: [],
    cameraX: 0,
    raceActive: false,
    frameCounter: 0,
    nextBoostTime: 0, 
    allGifs: [
      'hg.gif',
      'https://i.giphy.com/pnXGod6LmqiKhTL6iE.gif',
      'hg3.gif',
      'hg4.gif',
      'pika.gif',
      'run.gif',
      'frog.gif',
      'sonic.gif',
      'luffy.gif',
      'mario.gif'
    ],
    activeGifs: []
  };

  game.activeGifs = game.allGifs.slice();
  for (var i = 0; i < 100; i++) game.playerNames.push("Player " + (i + 1));

  game.init = function() {
    var modeSelect = document.getElementById('mode-select');
    modeSelect.onchange = function(e) {
        game.mode = e.target.value;
        document.getElementById('time-settings').style.display = (game.mode === 'time') ? 'block' : 'none';
        document.getElementById('lap-settings').style.display = (game.mode === 'laps') ? 'block' : 'none';
    };

    var orientSelect = document.getElementById('orient-select');
    orientSelect.onchange = function(e) {
        game.orientation = e.target.value;
        var container = document.getElementById('game-container');
        if (game.orientation === 'landscape') {
            container.classList.add('landscape-layout');
        } else {
            container.classList.remove('landscape-layout');
        }
    };

    var pSlider = document.getElementById('p-slider');
    if (pSlider) {
      pSlider.oninput = function(e) {
        game.playerCount = parseInt(e.target.value);
        document.getElementById('p-count').innerText = game.playerCount;
      };
    }

    var tSlider = document.getElementById('t-slider');
    if (tSlider) {
      tSlider.oninput = function(e) {
        game.raceDuration = parseInt(e.target.value);
        document.getElementById('t-count').innerText = game.raceDuration;
      };
    }
    
    var lSlider = document.getElementById('l-slider');
    if (lSlider) {
      lSlider.oninput = function(e) {
        game.laps = parseInt(e.target.value);
        document.getElementById('l-count').innerText = game.laps;
      };
    }
  };

  game.formatTime = function(sec) {
    var s = Math.floor(sec);
    var ms = Math.floor((sec % 1) * 100);
    return (s < 10 ? "0" : "") + s + "." + (ms < 10 ? "0" : "") + ms;
  };

  game.setActive = function(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    var target = document.getElementById(id);
    if (target) target.classList.add('active');
    document.getElementById('race-layer').style.display = (id === 'racing') ? 'block' : 'none';
    document.getElementById('leaderboard').style.display = (id === 'racing') ? 'block' : 'none';
    document.getElementById('race-timer').style.display = (id === 'racing' && game.mode === 'time') ? 'block' : 'none';
  };

  game.openMenu = function() { this.setActive('menu-screen'); this.raceActive = false; };

  game.openCustomize = function() {
    var ta = document.getElementById('names-input');
    ta.value = this.playerNames.slice(0, this.playerCount).join('\n');
    var poolHtml = "";
    for (var i = 0; i < this.allGifs.length; i++) {
      var gif = this.allGifs[i];
      var isChecked = this.activeGifs.includes(gif) ? "checked" : "";
      poolHtml += '<label class="char-label"><input type="checkbox" class="char-checkbox" value="' + gif + '" ' + isChecked + '><img src="' + gif + '"></label>';
    }
    document.getElementById('character-pool').innerHTML = poolHtml;
    this.setActive('customize-screen');
  };

  game.randomizeNames = function() {
    var ta = document.getElementById('names-input');
    var lines = ta.value.split('\n').filter(function(n) { return n.trim() !== ''; });
    lines.sort(function() { return Math.random() - 0.5; });
    ta.value = lines.join('\n');
  };

  game.preloadAll = function(callback) {
    var loaded = 0;
    var urlsToLoad = game.activeGifs.slice();
    if (!urlsToLoad.includes('hg.gif')) urlsToLoad.push('hg.gif');
    var toLoad = urlsToLoad.length;
    if(toLoad === 0) { callback(); return; }
    urlsToLoad.forEach(function(src) {
        var img = new Image();
        img.onload = img.onerror = function() {
            loaded++;
            if (loaded >= toLoad) callback();
        };
        img.src = src;
    });
  };

  game.startRace = function() {
    var self = this;
    self.setActive('loading-screen');
    var startTime = Date.now();
    if (self.activeGifs.length === 0) self.activeGifs = self.allGifs.slice();
    self.preloadAll(function() {
        var elapsed = Date.now() - startTime;
        var remaining = 5000 - elapsed;
        setTimeout(function() {
            self.setActive('racing');
            self.cameraX = 0;
            self.raceActive = false;
            self.finishRank = 1;
            self.nextBoostTime = 0;
            var fLine = document.getElementById('finish-line');
            fLine.classList.remove('finish-drop');
            document.getElementById('track-bg').style.transform = 'translate3d(0, 0, 0)';
            if (self.mode === 'time') {
                fLine.style.display = 'none';
                self.timeRemaining = self.raceDuration;
                document.getElementById('race-timer').innerText = self.formatTime(self.timeRemaining);
            } else {
                self.finishX = self.lapDistance * self.laps;
                fLine.style.display = 'block';
                fLine.style.left = '75000px'; 
            }
            var layer = document.getElementById('race-layer');
            layer.innerHTML = '';
            
            var startY = window.innerHeight * 0.26;
            var endY = window.innerHeight * 0.75;
            var trackHeight = endY - startY;
            var spacing = trackHeight / (self.playerCount - 1 || 1);
            
            self.racers = [];
            for (var i = 0; i < self.playerCount; i++) {
              var div = document.createElement('div');
              div.className = 'racer';
              div.style.top = (startY + (i * spacing)) + 'px';
              
              var img = document.createElement('img');
              var randomGif = self.activeGifs[Math.floor(Math.random() * self.activeGifs.length)];
              img.src = randomGif + "?v=" + Math.random() + i; 
              img.className = 'racer-img';
              
              var tag = document.createElement('div');
              tag.className = 'name-tag';
              tag.innerText = self.playerNames[i];
              
              div.appendChild(tag);
              div.appendChild(img);
              layer.appendChild(div);
              self.racers.push({ x: 10, speed: 0.5 + Math.random() * 1.5, dom: div, name: self.playerNames[i], rank: 0, finished: false, boostCountdown: 0 });
            }
            var count = 3;
            var cd = document.getElementById('countdown');
            cd.innerText = "3";
            var timer = setInterval(function() {
              count--;
              if (count > 0) cd.innerText = count;
              else if (count === 0) cd.innerText = "GO!";
              else {
                cd.innerText = "";
                clearInterval(timer);
                self.raceActive = true;
                self.lastTime = Date.now();
                self.loop();
              }
            }, 1000);
        }, Math.max(0, remaining));
    });
  };

  game.showVictory = function(finalRanks) {
      document.getElementById('winner-name').innerText = "🥇 1st: " + finalRanks[0].name;
      var pauseLength = (this.mode === 'time') ? 2500 : 1200;
      setTimeout(function() { 
          game.setActive('victory-screen'); 
          var vScreen = document.getElementById('victory-screen');
          vScreen.style.animation = 'none'; vScreen.offsetHeight; vScreen.style.animation = null; 
        }, pauseLength); 
  };

  game.loop = function() {
    if (!this.raceActive) return;
    var now = Date.now();
    var dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    this.frameCounter++;
    
    if (this.mode === 'time') {
        this.timeRemaining -= dt;
        if (this.timeRemaining <= 0) {
            this.timeRemaining = 0;
            this.raceActive = false; 
            var finalRanks = this.racers.slice().sort(function(a,b) { return b.x - a.x; });
            var fLine = document.getElementById('finish-line');
            fLine.classList.add('finish-drop');
            this.showVictory(finalRanks);
            return; 
        }
        document.getElementById('race-timer').innerText = this.formatTime(this.timeRemaining);
    }

    var activeBoostCount = this.racers.filter(r => !r.finished && r.boostCountdown > 0).length;
    if (activeBoostCount < 3 && now > this.nextBoostTime && Math.random() < 0.03) { 
        var eligible = this.racers.filter(r => !r.finished && r.boostCountdown <= 0);
        if (eligible.length > 0) {
            eligible.sort(function(a, b) { return a.x - b.x; });
            var chosen = eligible[Math.floor(Math.pow(Math.random(), 2.5) * eligible.length)];
            chosen.boostCountdown = 1.5; 
            this.nextBoostTime = now + 800; 
        }
    }

    var maxRacerX = 0;
    var allDone = true;
    for (var i = 0; i < this.racers.length; i++) {
      var r = this.racers[i];
      if (!r.finished) {
          allDone = false; 
          if (Math.random() < 0.02) r.speed = 0.8 + Math.random() * 1.1;
          if (r.boostCountdown > 0) { r.boostCountdown -= dt; r.x += r.speed * 1.3; r.dom.classList.add('boosted-racer'); }
          else { r.x += r.speed; r.dom.classList.remove('boosted-racer'); }
          if (this.mode === 'laps' && r.x >= this.finishX) { r.x = this.finishX; r.finished = true; r.rank = this.finishRank++; r.dom.classList.remove('boosted-racer'); }
      }
      if (r.x > maxRacerX) maxRacerX = r.x;
    }
    
    var containerWidth = document.getElementById('game-container').offsetWidth;
	var racerWidth = 1; 
	var targetCenterOffset = (containerWidth / 2) - (racerWidth / 2);

    this.cameraX = Math.max(0, maxRacerX - targetCenterOffset);
    
    for (var i = 0; i < this.racers.length; i++) {
        var r = this.racers[i];
        r.dom.style.left = (r.x - this.cameraX) + 'px';
    }

    document.getElementById('track-bg').style.transform = 'translate3d(' + (-this.cameraX * 0.7) + 'px, 0, 0)';
    if (this.mode === 'laps') document.getElementById('finish-line').style.left = (this.finishX - this.cameraX) + 'px';

    if (this.frameCounter % 15 === 0) {
        var sorted = this.racers.slice().sort(function(a,b) { 
            if (game.mode === 'laps') { if (a.finished && b.finished) return a.rank - b.rank; if (a.finished) return -1; if (b.finished) return 1; }
            return b.x - a.x; 
        }).slice(0, 5);
        document.getElementById('leaderboard').innerHTML = "<b>RANKINGS</b><br>" + sorted.map(function(r, i) { return (i==0?'🥇 ':i==1?'🥈 ':i==2?'🥉 ':i+1+'. ') + r.name; }).join('<br>');
    }

    if (this.mode === 'laps' && allDone) {
        this.raceActive = false;
        this.showVictory(this.racers.slice().sort(function(a,b) { return a.rank - b.rank; }));
        return;
    }
    requestAnimationFrame(function() { game.loop(); }); 
  };

  document.getElementById('btn-start').onclick = function() { game.startRace(); };
  document.getElementById('btn-customize').onclick = function() { game.openCustomize(); };
  document.getElementById('btn-randomize').onclick = function() { game.randomizeNames(); };
  document.getElementById('btn-play-again').onclick = function() { game.startRace(); };
  document.getElementById('btn-main-menu').onclick = function() { game.openMenu(); };

  document.getElementById('btn-back-menu').onclick = function() { 
    var ta = document.getElementById('names-input');
    var lines = ta.value.split('\n').map(function(n) { return n.trim(); }).filter(function(n) { return n !== ''; });
    if (lines.length > 0) {
      game.playerCount = lines.length;
      document.getElementById('p-count').innerText = game.playerCount;
      var slider = document.getElementById('p-slider');
      if (game.playerCount > parseInt(slider.max)) slider.max = game.playerCount;
      slider.value = game.playerCount;
      game.playerNames = lines;
      for (var i = game.playerNames.length; i < Math.max(100, game.playerCount + 50); i++) game.playerNames.push("Player " + (i + 1));
    }
    var checkboxes = document.querySelectorAll('.char-checkbox');
    game.activeGifs = [];
    checkboxes.forEach(function(cb) { if (cb.checked) game.activeGifs.push(cb.value); });
    if (game.activeGifs.length === 0) game.activeGifs = [game.allGifs[0]];
    game.openMenu(); 
  };

  game.init();
</script>
</body>
</html>
